name: Validate yoklama layout
on:
  push:
    branches: [gh-pages, preview-layout-v9, preview-sliders-v10, single-signature-header-v11, start-week-v12, compact-closed-weeks-v13, pdf-print-fidelity-v14, excel-border-layout-v15, all-sheets-border-no-sira-v16]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # v11 vs v12 byte-for-byte output regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel engine
        run: python -m pip install openpyxl==3.1.5
      - name: Check JavaScript syntax
        run: |
          node --check assets/helpers.js
          node --check assets/preview.js
          node --check assets/app.js
      - name: JavaScript layout regressions
        run: |
          node tests/test_helpers.cjs
          node tests/test_layout_helpers.cjs
          node tests/test_preview_layout.cjs
          node tests/test_balanced_sections.cjs
          node tests/test_slider_controls.cjs
          node tests/test_single_signature_header.cjs
          node tests/test_start_week.cjs
          node tests/test_v11_baseline.cjs
          node tests/test_compact_weeks.cjs
          node tests/test_pdf_fidelity.cjs
      - name: Python Excel regressions
        run: |
          python -m py_compile adaptive_layout.py web_bridge.py yoklama_olustur.py
          python tests/test_adaptive_layout.py
          python tests/test_start_week.py
          python tests/test_v11_baseline.py
          python tests/test_border_layout.py
          python tests/test_compact_weeks.py
          node tests/test_compact_parity.cjs
